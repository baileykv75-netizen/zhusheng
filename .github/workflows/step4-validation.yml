name: STEP 4 Validation

on:
  push:
    branches: [gpt/step4-guarded-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Sync generated assets
        run: |
          pnpm run sync:life-event-assets
          pnpm run sync:group-learning-assets
          pnpm run sync:building-intelligence-assets
      - name: Full Node regression
        run: pnpm test
      - name: Prepare portable browser QA runtime
        run: |
          pnpm add -w --save-dev --lockfile=false playwright@1.55.0
          pnpm exec playwright install --with-deps chromium
          sed -i 's#"C:/Users/Admin/.cache/codex-runtimes/codex-primary-runtime/dependencies/node/node_modules/playwright"#"playwright"#g' tests/evidence-correctness-qa.mjs tests/v6-lifecycle-qa.mjs
          sed -i 's#const output = "D:/Admin/Desktop/Project/zhusheng-agent/artifacts/exhibit-qa";#const output = "artifacts/exhibit-qa";#' tests/evidence-correctness-qa.mjs
          sed -i 's#const output = "D:/Admin/Desktop/Project/zhusheng-agent/artifacts/v6-lifecycle";#const output = "artifacts/v6-lifecycle";#' tests/v6-lifecycle-qa.mjs
          sed -i 's#, executablePath: "C:/Program Files/Google/Chrome/Application/chrome.exe"##' tests/evidence-correctness-qa.mjs
      - name: Start validation server
        run: |
          pnpm dev > /tmp/zhusheng-step4-next.log 2>&1 &
          echo $! > /tmp/zhusheng-step4-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/property >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhusheng-step4-next.log
          exit 1
      - name: Product boundary browser QA
        run: |
          pnpm run test:evidence-correctness
          pnpm run test:v6-lifecycle
          pnpm run security:scan
      - name: Stop validation server
        if: always()
        run: |
          if [ -f /tmp/zhusheng-step4-next.pid ]; then
            kill "$(cat /tmp/zhusheng-step4-next.pid)" || true
          fi
      - name: Production static build
        run: pnpm run build:next
        env:
          NEXT_PUBLIC_BASE_PATH: /zhusheng
      - name: Pages export verification
        run: pnpm run test:pages-export
        env:
          NEXT_PUBLIC_BASE_PATH: /zhusheng

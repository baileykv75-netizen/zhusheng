name: Product Refactor Check

on:
  push:
    branches: [gpt/product-shell-consolidation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync deterministic assets
        run: |
          pnpm run sync:life-event-assets
          pnpm run sync:group-learning-assets
          pnpm run sync:building-intelligence-assets
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build static product
        run: |
          pnpm run build:next
          pnpm run test:pages-export
        env:
          NEXT_PUBLIC_BASE_PATH: /zhusheng
          NEXT_PUBLIC_BUILDING_AGENT_GATEWAY_URL: ${{ vars.BUILDING_AGENT_GATEWAY_URL }}
      - name: Security scan
        run: pnpm run security:scan

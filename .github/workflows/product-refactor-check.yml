name: Product Refactor Check

on:
  push:
    branches: [gpt/product-shell-consolidation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync deterministic assets
        run: |
          pnpm run sync:life-event-assets
          pnpm run sync:group-learning-assets
          pnpm run sync:building-intelligence-assets
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Prepare product browser QA
        run: |
          pnpm add -w --save-dev --lockfile=false playwright@1.55.0
          pnpm exec playwright install --with-deps chromium
      - name: Start product QA server
        run: |
          pnpm dev > /tmp/zhusheng-product-qa.log 2>&1 &
          echo $! > /tmp/zhusheng-product-qa.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/property >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zhusheng-product-qa.log
          exit 1
      - name: Browser regression QA
        run: pnpm run test:css-delivery
      - name: Stop product QA server
        if: always()
        run: |
          if [ -f /tmp/zhusheng-product-qa.pid ]; then
            kill "$(cat /tmp/zhusheng-product-qa.pid)" || true
          fi
      - name: Build static product
        run: |
          pnpm run build:next
          pnpm run test:pages-export
        env:
          NEXT_PUBLIC_BASE_PATH: /zhusheng
          NEXT_PUBLIC_BUILDING_AGENT_GATEWAY_URL: ${{ vars.BUILDING_AGENT_GATEWAY_URL }}
      - name: Security scan
        run: pnpm run security:scan

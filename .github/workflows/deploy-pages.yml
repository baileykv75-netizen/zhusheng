name: Deploy GitHub Pages

# STEP 4 preview deployments are allowed from the dedicated preview branch.
on:
  push:
    branches: [main, gpt/step4-guarded-lifecycle]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify product boundaries
        run: |
          pnpm run typecheck
          pnpm run sync:life-event-assets
          pnpm run sync:group-learning-assets
          pnpm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          pnpm run build:next
          pnpm run test:pages-export
        env:
          NEXT_PUBLIC_BASE_PATH: /zhusheng
          NEXT_PUBLIC_BUILDING_AGENT_GATEWAY_URL: ${{ vars.BUILDING_AGENT_GATEWAY_URL }}
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

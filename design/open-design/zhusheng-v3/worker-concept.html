<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>筑生 V3 工友端概念母版</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    *{box-sizing:border-box} body{margin:0;background:var(--zs-canvas);color:var(--zs-ink);font:14px/1.6 "Noto Sans SC","Microsoft YaHei",sans-serif}.sheet{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:64px 0}.eyebrow{color:var(--zs-water);font-size:11px;font-weight:700}.head{display:flex;justify-content:space-between;align-items:end;gap:32px;margin-bottom:40px}.head h1{margin:8px 0 0;font-size:40px;font-weight:520;line-height:1.2}.room{padding-left:18px;border-left:1px solid var(--zs-line)}.room span,.room strong{display:block}.room span{color:var(--zs-muted);font-size:11px}.progress{display:grid;grid-template-columns:repeat(3,1fr);max-width:650px;margin:0 0 40px;padding:0;list-style:none}.progress li{display:flex;align-items:center;gap:9px;color:var(--zs-muted)}.progress li:after{content:"";height:1px;flex:1;background:var(--zs-line)}.progress li:last-child:after{display:none}.progress b{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--zs-brand);border-radius:50%;color:#fff;background:var(--zs-brand);font-size:10px}.layout{display:grid;grid-template-columns:1fr 300px;gap:64px}.work{padding:38px;background:#fff;border-top:1px solid var(--zs-ink)}.voice{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--zs-ink);color:#fff;background:var(--zs-ink)}.voice i{width:64px;height:64px;display:grid;place-items:center;border:1px solid #606669;border-radius:50%;color:#e3a72f;font-style:normal;font-size:24px}.voice strong{margin-top:14px;font-size:19px}.voice span{color:#b8bfbc;font-size:12px}.side h2{margin:14px 0;font-size:24px;font-weight:520;line-height:1.35}.side p{color:var(--zs-muted)}.side dl{margin-top:28px;border-top:1px solid var(--zs-line)}.side div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--zs-line)}.side dt{color:var(--zs-muted)}.side dd{margin:0;font-weight:700}@media(max-width:700px){.sheet{padding:30px 0}.head,.layout{display:block}.head h1{font-size:30px}.room{margin-top:24px;padding-left:0;border:0}.progress{margin-top:28px}.work{padding:18px}.voice{min-height:250px}.side{margin-top:36px}}
  </style>
</head>
<body>
  <main class="sheet">
    <header class="head"><div><span class="eyebrow">现场记录 · 今日工序 03 / 06</span><h1>冷热水支管接头复核</h1></div><div class="room"><span>当前空间</span><strong>1602卫生间 · W-1602-B7</strong></div></header>
    <ol class="progress"><li><b>01</b>现场口述</li><li><b>02</b>AI整理</li><li><b>03</b>品质核验</li></ol>
    <section class="layout"><div class="work"><div class="voice"><i>●</i><strong>按下口述施工情况</strong><span>说明施工状态、保压结果与照片情况</span></div></div><aside class="side"><span class="eyebrow">本次留痕</span><h2>验收前把关键事实说清楚</h2><p>系统只整理工友提供的内容，不补写不存在的证据。</p><dl><div><dt>构件</dt><dd>W-1602-B7</dd></div><div><dt>已有证据</dt><dd>3条</dd></div><div><dt>隐私状态</dt><dd>仅本地预览</dd></div></dl></aside></section>
  </main>
</body>
</html>
